# Daily price refresh + model refit + history snapshot.
#
# Re-fetches every displayed card's Cardmarket price, refreshes those prices
# inside the committed training data, refits the model (so the fair price is
# "live" too), rebakes all sets, regenerates the indexes, and appends today's
# trend + fair to the per-card history (public/history/<set>.json). Then it
# commits the changed data, which triggers Vercel to redeploy.
#
# Deliberately does NOT run build-training-data.mjs: that reads the ~19k-card
# cache, which is gitignored and absent on a fresh CI checkout. refresh-prices
# only refetches the ~4.4k displayed cards, so refresh-training-prices.mjs
# patches just those rows into the committed training set instead — keeping the
# model's full historical breadth. No npm install: the scripts use only Node
# built-ins and repo-local modules.
#
# Hand-corrected prices are untouched everywhere: both the training patch and
# ingest lay the manual value over the fetched one.
#
# Needs "Read and write permissions" for Actions (repo Settings → Actions →
# General → Workflow permissions) so the built-in token can push.
name: Daily prices

on:
  schedule:
    # 09:17 UTC — an odd minute, not the top of the hour, which GitHub delays or
    # drops under load. Still after Cardmarket's ~08:00 update.
    - cron: '17 9 * * *'
  workflow_dispatch: {} # allow a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas scikit-learn scipy statsmodels

      - name: Refresh prices, refit, rebake, snapshot
        run: |
          set -e
          mkdir -p scripts/.cache/cards
          node scripts/refresh-prices.mjs
          node scripts/refresh-training-prices.mjs
          python analysis/fit_factors.py
          SETS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/data/generated/sets.json','utf8')).map(s=>s.id).join(' '))")
          node scripts/ingest.mjs $SETS
          node scripts/build-search-index.mjs
          node scripts/build-sitemap.mjs
          node scripts/build-outlier-candidates.mjs
          node scripts/build-factor-highlights.mjs
          node scripts/snapshot-prices.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily price refresh + history snapshot ($(date -u +%Y-%m-%d))"
            git push
          fi
